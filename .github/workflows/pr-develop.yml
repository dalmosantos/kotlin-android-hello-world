name: CI - Develop Branch

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Type of runner to use'
        default: 'macos-13'
        required: true
      architecture:
        description: 'Architecture to use'
        default: 'x86_64'
        required: true
      java_version:
        description: 'Java version to use'
        default: '17'
        required: true
      gradle_version:
        description: 'Gradle version to use'
        default: '8.13'
        required: true
      timezone:
        description: 'Timezone to use'
        default: 'America/Sao_Paulo'
        required: true
      language:
        description: 'Language to use'
        default: 'en_US.UTF-8'
        required: true
      locale:
        description: 'Locale to use'
        default: 'en_US.UTF-8'
        required: true
      max_parallel:
        description: 'Maximum number of parallel jobs'
        default: '3'
        required: true
      timeout_minutes:
        description: 'Timeout in minutes'
        default: '60'
        required: true
      emulator_count:
        description: 'Number of emulators to run'
        default: '2'
        required: true
      sequential_boot:
        description: 'Boot emulators sequentially'
        type: boolean
        default: false
        required: false
jobs:
  android_tests_versions_7_to_10:
    # This job tests Android versions 7.0 to 10.0
    strategy:
      matrix:
        android-version:
          - { api: 24, name: "7.0", pixel: "xl" }
          - { api: 26, name: "8.0", pixel: "2" }
          - { api: 28, name: "9", pixel: "3a" }
          - { api: 29, name: "10", pixel: "4a" }
    uses: ./.github/workflows/android-multi-version-test.yml
    with:
      android_version: ${{ matrix.android-version.name }}
      api_level: ${{ matrix.android-version.api }}
      pixel: ${{ matrix.android-version.pixel }}
      system_image: "system-images;android-${{ matrix.android-version.api }};google_apis;${{ inputs.architecture }}"
      runner_type: ${{ inputs.runner_type }}
      architecture: ${{ inputs.architecture }}
      java_version: ${{ inputs.java_version }}
      gradle_version: ${{ inputs.gradle_version }}
      timezone: ${{ inputs.timezone }}
      language: ${{ inputs.language }}
      locale: ${{ inputs.locale }}
      max_parallel: ${{ inputs.max_parallel }}
      timeout-minutes: ${{ inputs.timeout_minutes }}
      commit_hash_short: ""
      emulator_count: ${{ inputs.emulator_count }}

  android_tests_versions_11_to_15:
    strategy:
      matrix:
        android-version:
          - { api: 30, name: "11", pixel: "5" }
          - { api: 31, name: "12", pixel: "6a" }
          - { api: 33, name: "13", pixel: "7a" }
          - { api: 34, name: "14", pixel: "8a" }
          - { api: 35, name: "15", pixel: "8a" }
    uses: ./.github/workflows/android-multi-version-test.yml
    with:
      android_version: ${{ matrix.android-version.name }}
      api_level: ${{ matrix.android-version.api }}
      pixel: ${{ matrix.android-version.pixel }}
      system_image: "system-images;android-${{ matrix.android-version.api }};google_apis_playstore;${{ inputs.architecture }}"
      runner_type: ${{ inputs.runner_type }}
      architecture: ${{ inputs.architecture }}
      java_version: ${{ inputs.java_version }}
      gradle_version: ${{ inputs.gradle_version }}
      timezone: ${{ inputs.timezone }}
      language: ${{ inputs.language }}
      locale: ${{ inputs.locale }}
      max_parallel: ${{ inputs.max_parallel }}
      timeout-minutes: ${{ inputs.timeout_minutes }}
      commit_hash_short: ""
      emulator_count: ${{ inputs.emulator_count }}

