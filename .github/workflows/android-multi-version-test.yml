name: Android Multi-Version Test Template (Optimized)

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
        description: 'Android version name'
      api_level:
        required: true
        type: number
        description: 'Android API level'
      pixel:
        required: true
        type: string
        description: 'Pixel device model'
      system_image:
        required: true
        type: string
        description: 'Android system image path'
      runner_type:
        required: true
        type: string
        description: 'GitHub runner type'
      architecture:
        required: true
        type: string
        description: 'CPU architecture'
      java_version:
        required: true
        type: string
        description: 'Java version'
      gradle_version:
        required: true
        type: string
        description: 'Gradle version'
      timezone:
        required: true
        type: string
        description: 'Timezone setting'
      language:
        required: true
        type: string
        description: 'Language setting'
      locale:
        required: true
        type: string
        description: 'Locale setting'
      max_parallel:
        required: true
        type: number
        description: 'Maximum parallel jobs'
      timeout-minutes:
        required: true
        type: number
        default: 45
        description: 'Timeout in minutes'
      commit_hash:
        required: false
        type: string
        default: ''
        description: 'Short commit hash for job naming'
      emulator_count:
        required: false
        type: number
        default: 1
        description: 'Number of emulators to start per runner'
      sequential_boot:
        required: false
        type: boolean
        default: false
        description: 'Boot emulators sequentially'

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ARTIFACTS_BASE_PATH: artifacts/${{ inputs.api_level }}
  TZ: ${{ inputs.timezone }}
  LANG: ${{ inputs.language }}
  LC_ALL: ${{ inputs.locale }}
  EMULATOR_COUNT: ${{ inputs.emulator_count }}
  MEMORY_SIZE: ${{ inputs.api_level <= 26 && '1536' || inputs.api_level <= 30 && '2048' || '2560' }}
  HEAP_SIZE: ${{ inputs.api_level <= 26 && '192' || inputs.api_level <= 30 && '256' || '384' }}

jobs:
  android_test:
    runs-on: ${{ inputs.runner_type }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel > 0 && inputs.max_parallel || 1 }}
      matrix:
        include:
          - dummy: value
    timeout-minutes: ${{ inputs.timeout-minutes }}
    name: ${{ inputs.commit_hash != '' && format('Test Android {0} (API {1}) - Pixel {2} - {3}', inputs.android_version, inputs.api_level, inputs.pixel, inputs.commit_hash) || format('Test Android {0} (API {1}) - Pixel {2}', inputs.android_version, inputs.api_level, inputs.pixel) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Cache Gradle and SDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/android-sdk
          key: ${{ runner.os }}-android-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ inputs.api_level }}-${{ inputs.gradle_version }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-${{ inputs.api_level }}-
            ${{ runner.os }}-android-gradle-
            ${{ runner.os }}-android-

      - name: Install Android SDK (Optimized)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sdk_url="https://dl.google.com/android/repository/commandlinetools-mac-9477386_latest.zip"
          else
            sdk_url="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          fi
          
          curl -o sdk.zip "$sdk_url"
          unzip -q sdk.zip -d $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Detect build-tools version
        id: buildtools
        run: |
          api=${{ inputs.api_level }}
          version=$(sdkmanager --list | grep -o 'build-tools;[0-9.]*' | sed 's/build-tools;//' | sort -V | grep "^$api[.]" | tail -1)
          echo "BUILD_TOOLS_VERSION=${version:-$(sdkmanager --list | grep -o 'build-tools;[0-9.]*' | sed 's/build-tools;//' | sort -V | tail -1)}" >> $GITHUB_ENV
          echo "Using build-tools $BUILD_TOOLS_VERSION"

      - name: Accept licenses and install SDK components (Optimized)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "platforms;android-${{ inputs.api_level }}" \
            "${{ inputs.system_image }}" \
            "emulator" \
            "patcher;v4" > /dev/null

      - name: Build project (Optimized)
        run: |
          ./gradlew assembleDebug \
            --build-cache \
            --parallel \
            --configuration-cache \
            --max-workers=$(sysctl -n hw.ncpu) \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.configureondemand=true \
            -Pandroid.buildToolsVersion=$BUILD_TOOLS_VERSION

      - name: Create optimized AVDs
        run: |
          EMULATOR_PORTS_ARRAY=($(seq 5554 2 $((5554 + (EMULATOR_COUNT - 1) * 2))))
          
          for i in "${!EMULATOR_PORTS_ARRAY[@]}"; do
            port=${EMULATOR_PORTS_ARRAY[$i]}
            avd_name="test$i"
            
            echo "no" | avdmanager create avd -n "$avd_name" \
              -d "pixel_${{ inputs.pixel }}" \
              -k "${{ inputs.system_image }}" \
              --force
            
            # Optimized AVD configuration
            config_file="$HOME/.android/avd/${avd_name}.avd/config.ini"
            echo "hw.ramSize=$MEMORY_SIZE" >> "$config_file"
            echo "hw.gpu.enabled=yes" >> "$config_file"
            echo "hw.gpu.mode=auto" >> "$config_file"
            echo "hw.cpu.ncore=2" >> "$config_file"
            echo "vm.heapSize=$HEAP_SIZE" >> "$config_file"
            echo "disk.dataPartition.size=2G" >> "$config_file"
            echo "fastboot.forceColdBoot=no" >> "$config_file"
            echo "hw.keyboard=yes" >> "$config_file"
            echo "hw.mainKeys=no" >> "$config_file"
            echo "hw.camera.back=none" >> "$config_file"
            echo "hw.camera.front=none" >> "$config_file"
            echo "avd.ini.displayname=${avd_name}" >> "$config_file"
          done
          echo "EMULATOR_PORTS_LIST=${EMULATOR_PORTS_ARRAY[*]}" >> $GITHUB_ENV

      - name: Start emulators (Optimized)
        run: |
          set -euo pipefail
          adb start-server
          
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          for i in "${!EMULATOR_PORTS_ARRAY[@]}"; do
            port=${EMULATOR_PORTS_ARRAY[$i]}
            avd_name="test$i"
            
            $ANDROID_HOME/emulator/emulator -avd "$avd_name" \
              -port $port \
              -no-snapshot -no-boot-anim -no-audio -no-window \
              -gpu swiftshader_indirect \
              -memory $MEMORY_SIZE \
              -partition-size 2048 \
              -cache-size 512 \
              -accel on \
              -qemu -smp 2 \
              -skip-adb-auth \
              -no-snapshot-save \
              -no-snapshot-load \
              -no-passive-gps \
              -no-location-ui \
              -no-jni \
              -no-qt > /dev/null 2>&1 &
            
            [[ "$SEQUENTIAL_BOOT" == "true" ]] && sleep 20
          done
          
          sleep 10

      - name: Fast emulator boot wait
        timeout-minutes: 8
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=15
          SLEEP_SECONDS=10
          
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            echo "=== Fast booting emulator-$port ==="
            
            for ((n=1; n<=MAX_ATTEMPTS; n++)); do
              boot_completed=$(adb -s emulator-$port shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "0")
              
              if [[ "$boot_completed" == "1" ]]; then
                adb -s emulator-$port shell input keyevent 82 2>/dev/null
                echo "✅ Emulator $port ready in $((n * SLEEP_SECONDS)) seconds"
                break
              fi
              
              # Accelerate boot process
              adb -s emulator-$port shell "setprop service.bootanim.exit 1" 2>/dev/null || true
              adb -s emulator-$port shell "stop perfd" 2>/dev/null || true
              
              sleep $SLEEP_SECONDS
            done
            
            [[ "$boot_completed" != "1" ]] && echo "❌ Emulator $port failed to boot" && exit 1
          done

      - name: Configure emulator for testing
        run: |
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            adb -s emulator-$port shell settings put global window_animation_scale 0
            adb -s emulator-$port shell settings put global transition_animation_scale 0
            adb -s emulator-$port shell settings put global animator_duration_scale 0
            adb -s emulator-$port shell settings put global hidden_api_policy 1
            adb -s emulator-$port shell svc power stayon true
            adb -s emulator-$port shell input keyevent 82
          done
          
          sleep 5

      - name: Install APKs (Optimized)
        timeout-minutes: 5
        run: |
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            adb -s emulator-$port install -r -t app/build/outputs/apk/debug/app-debug.apk
          done

      - name: Run instrumentation tests (Optimized)
        run: |
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          if [[ ${#EMULATOR_PORTS_ARRAY[@]} -gt 1 ]]; then
            for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
              ./gradlew connectedAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.deviceSerial=emulator-$port \
                --max-workers=$(sysctl -n hw.ncpu)
            done
          else
            ./gradlew connectedAndroidTest --parallel --max-workers=$(sysctl -n hw.ncpu)
          fi

      - name: Capture screenshots
        if: always()
        run: |
          mkdir -p $ARTIFACTS_BASE_PATH/screenshots
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            adb -s emulator-$port exec-out screencap -p > $ARTIFACTS_BASE_PATH/screenshots/emulator-$port.png 2>/dev/null || true
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-api-${{ inputs.api_level }}
          path: $ARTIFACTS_BASE_PATH/screenshots/*.png

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-${{ inputs.api_level }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 1

      - name: Aggressive cleanup
        if: always()
        run: |
          pkill -9 -f "emulator" 2>/dev/null || true
          pkill -9 -f "qemu" 2>/dev/null || true
          adb kill-server 2>/dev/null || true
          rm -rf $ANDROID_HOME ~/.android /tmp/android-* 2>/dev/null || true