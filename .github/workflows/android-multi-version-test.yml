name: Android Multi-Version Test Template

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
        description: 'Android version name'
      api_level:
        required: true
        type: string
        description: 'Android API level (can be a single value or array)'
      pixel:
        required: true
        type: string
        description: 'Pixel device model'
      system_image:
        required: true
        type: string
        description: 'Android system image path'
      runner_type:
        required: true
        type: string
        description: 'GitHub runner type'
      architecture:
        required: true
        type: string
        description: 'CPU architecture'
      java_version:
        required: true
        type: string
        description: 'Java version'
      gradle_version:
        required: true
        type: string
        description: 'Gradle version'
      timezone:
        required: true
        type: string
        default: 'America/Sao_Paulo'
        description: 'Timezone setting'
      language:
        required: true
        type: string
        default: 'en_US.UTF-8'
        description: 'Language setting'
      locale:
        required: true
        type: string
        default: 'en_US.UTF-8'
        description: 'Locale setting'
      max_parallel:
        required: true
        type: number
        description: 'Maximum parallel jobs'
      timeout-minutes:
        required: true
        type: number
        default: 90
        description: 'Timeout in minutes'
      commit_hash:
        required: false
        type: string
        default: ''
        description: 'Short commit hash for job naming'
      emulator_count:
        required: false
        type: number
        default: 1
        description: 'Number of emulators to start per runner (recommended: 1 for stability)'
      sequential_boot:
        required: false
        type: boolean
        default: true
        description: 'Boot emulators sequentially instead of simultaneously'

jobs:
  android_test:
    runs-on: ${{ inputs.runner_type }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel > 0 && inputs.max_parallel || 1 }}
      matrix:
        include:
          - dummy: value
    timeout-minutes: ${{ inputs.timeout-minutes }}
    name: ${{ inputs.commit_hash != '' && format('Test Android {0} (API {1}) - Pixel {2} - {3}', inputs.android_version, inputs.api_level, inputs.pixel, inputs.commit_hash) || format('Test Android {0} (API {1}) - Pixel {2}', inputs.android_version, inputs.api_level, inputs.pixel) }}

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ARTIFACTS_BASE_PATH: artifacts/multi-api
      TZ: ${{ inputs.timezone }}
      LANG: ${{ inputs.language }}
      LC_ALL: ${{ inputs.locale }}
      EMULATOR_COUNT: ${{ inputs.emulator_count }}
      SEQUENTIAL_BOOT: ${{ inputs.sequential_boot }}
      # Adiciona variáveis para múltiplos emuladores
      ANDROID_VERSIONS: ${{ inputs.android_version }}
      API_LEVELS: ${{ inputs.api_level }}
      SYSTEM_IMAGES: ${{ inputs.system_image }}
      PIXEL_MODEL: "pixel_3a"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Cache Gradle and SDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/android-sdk
          key: ${{ runner.os }}-android-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-multi-api-${{ inputs.gradle_version }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-multi-api-
            ${{ runner.os }}-android-gradle-
            ${{ runner.os }}-android-
          fail-on-cache-miss: false

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            url=$(curl -s https://developer.android.com/studio#command-tools | grep -oE 'https://dl.google.com/android/repository/commandlinetools-mac-[0-9]+_latest.zip' | head -1)
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            url=$(curl -s https://developer.android.com/studio#command-tools | grep -oE 'https://dl.google.com/android/repository/commandlinetools-linux-[0-9]+_latest.zip' | head -1)
          else
            echo "Unsupported OS: $RUNNER_OS"
            exit 1
          fi
          curl -o sdk.zip "$url"
          unzip -q sdk.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Detect compatible build-tools version
        id: buildtools
        run: |
          # If multiple API levels are provided (e.g., "28,35"), use the highest to find compatible build-tools.
          # Otherwise, use the single provided API level.
          if [[ "${{ inputs.api_level }}" == *","* ]]; then
            api_to_check=$(echo "${{ inputs.api_level }}" | tr ',' '\n' | sort -nr | head -n1)
            echo "Multiple API levels detected. Using highest API level $api_to_check to find build-tools."
          else
            api_to_check="${{ inputs.api_level }}"
            echo "Single API level detected. Using API level $api_to_check to find build-tools."
          fi
          
          sdkmanager --list | grep -o 'build-tools;[0-9.]*' | sed 's/build-tools;//' \
            | sort -V | grep "^$api_to_check[.]" | tail -1 | while read version; do
                echo "BUILD_TOOLS_VERSION=$version" >> $GITHUB_ENV
            done
          
          if [[ -z "${BUILD_TOOLS_VERSION:-}" ]]; then
            echo "Warning: Could not automatically detect a build-tools version for API $api_to_check."
            echo "Gradle will use the version specified in the project or its default."
          else
            echo "Using build-tools $BUILD_TOOLS_VERSION (detected for API $api_to_check)"
          fi

      - name: Accept licenses and install SDK components
        run: |
          printf "y\ny\ny\ny\ny\ny\ny\ny\n" | sdkmanager --licenses > /dev/null
          sdkmanager --update --channel=0
          
          INSTALL_PACKAGES=("tools" "platform-tools" "emulator")
          if [[ -n "${BUILD_TOOLS_VERSION:-}" ]]; then
            INSTALL_PACKAGES+=("build-tools;${BUILD_TOOLS_VERSION}")
          else
            echo "BUILD_TOOLS_VERSION not set, skipping explicit build-tools installation by sdkmanager."
          fi

          IFS=',' read -ra API_LEVELS_TO_INSTALL <<< "${API_LEVELS}" # API_LEVELS from env, which is inputs.api_level
          for single_api_level in "${API_LEVELS_TO_INSTALL[@]}"; do
            INSTALL_PACKAGES+=("platforms;android-${single_api_level}")
          done

          IFS=',' read -ra SYSTEM_IMAGES_TO_INSTALL <<< "${SYSTEM_IMAGES}" # SYSTEM_IMAGES from env, which is inputs.system_image
          INSTALL_PACKAGES+=("${SYSTEM_IMAGES_TO_INSTALL[@]}")
          
          sdkmanager --install --channel=0 \
            "${INSTALL_PACKAGES[@]}"
            
      - name: Build project
        run: |
          set -euo pipefail
          echo "Building project with Gradle .."
          if command -v nproc >/dev/null 2>&1; then
            MAX_WORKERS=$(nproc)
          else
            MAX_WORKERS=$(sysctl -n hw.ncpu)
          fi
          echo "Using $MAX_WORKERS workers for Gradle build"
          ./gradlew assembleDebug \
            --build-cache \
            --parallel \
            --configuration-cache \
            --max-workers=$MAX_WORKERS \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.configureondemand=true \
            -Pandroid.buildToolsVersion=${{ env.BUILD_TOOLS_VERSION }}

      - name: Create AVDs
        run: |
          # Suporte a múltiplos emuladores
          IFS=',' read -ra API_LEVELS_ARR <<< "${API_LEVELS}"
          IFS=',' read -ra SYSTEM_IMAGES_ARR <<< "${SYSTEM_IMAGES}"
          EMULATOR_PORTS_ARRAY=($(seq 5554 2 $((5554 + (${#API_LEVELS_ARR[@]} - 1) * 2))))
          for i in "${!API_LEVELS_ARR[@]}"; do
            port=${EMULATOR_PORTS_ARRAY[$i]}
            api_level=${API_LEVELS_ARR[$i]}
            system_image=${SYSTEM_IMAGES_ARR[$i]}
            avd_name="Pixel_3a_API_${api_level}_Emulator_$i"
            echo "Creating AVD: $avd_name for port: $port"
            echo "no" | avdmanager create avd -n $avd_name \
              -d "pixel_3a" \
              -k "$system_image" \
              --force
          done
          echo "EMULATOR_PORTS_LIST=${EMULATOR_PORTS_ARRAY[*]}" >> $GITHUB_ENV


      - name: Start emulators
        run: |
          set -euo pipefail
          IFS=',' read -ra API_LEVELS_ARR <<< "${API_LEVELS}"
          EMULATOR_PORTS_ARRAY=($(seq 5554 2 $((5554 + (${#API_LEVELS_ARR[@]} - 1) * 2))))
          # Parse language and country from LANG/LC_ALL for emulator props
          LANG_ENV="${LANG:-${LC_ALL:-en_US.UTF-8}}"
          PARSED_LANG=$(echo "$LANG_ENV" | awk -F'[_\.]' '{print $1}')
          PARSED_COUNTRY=$(echo "$LANG_ENV" | awk -F'[_\.]' '{print $2}')
          BCP47_LOCALE="${PARSED_LANG}-${PARSED_COUNTRY}"

          export PARSED_LANG
          export PARSED_COUNTRY
          export BCP47_LOCALE

          echo "🧱 Preparing emulator startup with ${EMULATOR_COUNT} instance(s)..."
          mkdir -p ${{ env.ARTIFACTS_BASE_PATH }}/emulator-logs
          adb start-server
          
          EMULATOR_PORTS_ARRAY=($(seq 5554 2 $((5554 + (EMULATOR_COUNT - 1) * 2))))
          echo "EMULATOR_PORTS_LIST=${EMULATOR_PORTS_ARRAY[*]}" >> $GITHUB_ENV

          for i in "${!EMULATOR_PORTS_ARRAY[@]}"; do
            port=${EMULATOR_PORTS_ARRAY[$i]}
            api_level=${API_LEVELS_ARR[$i]}
            avd_name="Pixel_3a_API_${api_level}_Emulator_$i"
            log_file="${{ env.ARTIFACTS_BASE_PATH }}/emulator-logs/emulator-${port}-start.log"
            
            # Determine memory size based on the current emulator's API level
            current_memory_size="3584" # Default
            if [[ "$api_level" -le 26 ]]; then
              current_memory_size="2048"
            fi

            echo "🚀 Starting $avd_name on port $port"
            $ANDROID_HOME/emulator/emulator -avd "$avd_name" -port "$port" \
              -no-window -no-audio -no-snapshot -no-boot-anim \
              -gpu swiftshader_indirect \
              -memory "$current_memory_size" \
              -partition-size 2048 \
              -cache-size 1024 \
              -accel on \
              -prop persist.sys.timezone="$TZ" \
              -prop persist.sys.language="$PARSED_LANG" \
              -prop persist.sys.country="$PARSED_COUNTRY" \
              -prop persist.sys.locale="$BCP47_LOCALE" \
              -qemu -smp 2 &> "$log_file" &

            EMU_PID=$!
            sleep 5

            if ! ps -p $EMU_PID > /dev/null; then
              echo "❌ Failed to start emulator $avd_name (port $port). Log:"
              tail -n 50 "$log_file"
              exit 1
            fi

            echo "✅ Emulator $avd_name launched."

            if [[ "$SEQUENTIAL_BOOT" == "true" && $i -lt $((${#EMULATOR_PORTS_ARRAY[@]} - 1)) ]]; then
              echo "⏳ Waiting before next boot..."
              sleep 60
            fi
          done

          echo "⏰ Waiting 60s to allow emulators to boot partially before applying locale fix..."
          sleep 60

      - name: Wait for emulators to boot
        timeout-minutes: 20
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=20
          BOOT_COMPLETE_PROP="sys.boot_completed"

          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          echo "Waiting for ${#EMULATOR_PORTS_ARRAY[@]} emulator(s) to boot..."

          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            LOGCAT_FILE="${ARTIFACTS_BASE_PATH}/boot-logcat-emulator-$port.txt"
            mkdir -p "$(dirname "$LOGCAT_FILE")"
            touch "$LOGCAT_FILE"

            # Kill existing logcat processes for this port
            pkill -f "adb -s emulator-$port logcat" || true

            # Start capturing logcat output for this emulator
            adb -s emulator-$port logcat -G 16M
            adb -s emulator-$port logcat -v time *:V > "$LOGCAT_FILE" &
            LOGCAT_PID=$!

            wait_for_emulator() {
              for ((i=1; i<=MAX_ATTEMPTS; i++)); do
                echo "ADB State: $(adb -s emulator-$port get-state)"
                echo "Boot Property: $(adb -s emulator-$port shell getprop $BOOT_COMPLETE_PROP)"
                if adb -s emulator-$port get-state 2>/dev/null | grep -q "device"; then
                  if adb -s emulator-$port shell getprop "$BOOT_COMPLETE_PROP" 2>/dev/null | grep -q 1; then
                    echo "✅ Emulator-$port booted in $((i * SLEEP_SECONDS)) seconds"
                    return 0
                  fi
                fi
                echo "⏳ Waiting for emulator-$port... (Attempt $i/$MAX_ATTEMPTS)"
                sleep $SLEEP_SECONDS
              done
              return 1
            }

            if wait_for_emulator; then
              echo "Emulator-$port booted, sending keyevent to unlock..."
              RETRIES=0
              MAX_RETRIES=5
              until adb -s emulator-$port shell input keyevent 82 2>/dev/null || [ $RETRIES -eq $MAX_RETRIES ]; do
                echo "🔄 Keyevent input failed, retrying..."
                sleep 3
                RETRIES=$((RETRIES+1))
              done
              android_version=$(adb -s emulator-$port shell getprop ro.build.version.release 2>/dev/null || echo "unknown")
              api_level=$(adb -s emulator-$port shell getprop ro.build.version.sdk 2>/dev/null || echo "unknown")
              echo "# ----- 📱 Emulator $port Ready: Android $android_version (API $api_level) -----"
            else
              echo "❌ Emulator-$port failed to boot"
              echo "🔍 Boot log (last 50 lines):"
              tail -n 50 "$LOGCAT_FILE" | grep -i "error" || tail -n 50 "$LOGCAT_FILE"
              kill $LOGCAT_PID || true
              exit 1
            fi

            kill $LOGCAT_PID || true
            echo "📄 Final boot logcat for emulator-$port (last 30 lines):"
            tail -n 30 "$LOGCAT_FILE"
            sleep 5
          done

          echo "🎉 All emulators are ready!"
          sleep 10

      - name: Configure emulator system settings
        run: |
          set -euo pipefail

          # Parse language and country from LANG/LC_ALL for emulator props
          LANG_ENV="${LANG:-${LC_ALL:-en_US.UTF-8}}"
          PARSED_LANG=$(echo "$LANG_ENV" | awk -F'[_\.]' '{print $1}')
          PARSED_COUNTRY=$(echo "$LANG_ENV" | awk -F'[_\.]' '{print $2}')
          BCP47_LOCALE="${PARSED_LANG}-${PARSED_COUNTRY}"

          # Padroniza a conversão de array
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            # Configurações de locale/timezone
            adb -s emulator-$port shell "setprop persist.sys.timezone '$TZ'"
            adb -s emulator-$port shell "setprop persist.sys.language '$PARSED_LANG'"
            adb -s emulator-$port shell "setprop persist.sys.country '$PARSED_COUNTRY'"
            adb -s emulator-$port shell "setprop persist.sys.locale '$BCP47_LOCALE'"
            adb -s emulator-$port shell settings put system system_locales "$BCP47_LOCALE" || true

            # Desabilita animações para testes
            adb -s emulator-$port shell settings put global window_animation_scale 0 2>/dev/null || true
            adb -s emulator-$port shell settings put global transition_animation_scale 0 2>/dev/null || true
            adb -s emulator-$port shell settings put global animator_duration_scale 0 2>/dev/null || true

            # Otimizações para testes
            adb -s emulator-$port shell settings put system screen_off_timeout 1800000 2>/dev/null || true
            adb -s emulator-$port shell svc power stayon true 2>/dev/null || true

            # Reinicia zygote para aplicar tudo
            adb -s emulator-$port shell "stop; sleep 5; start"
          done
          sleep 8

      - name: Install APKs
        timeout-minutes: 8
        run: |
          # Convert space-separated string to array
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            echo "📱 Installing APK on emulator-$port..."
            
            # Retry installation with backoff
            INSTALL_RETRIES=0
            MAX_INSTALL_RETRIES=5
            until adb -s emulator-$port install app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || [[ $INSTALL_RETRIES -eq $MAX_INSTALL_RETRIES ]]; do
              echo "🔄 APK installation failed for emulator-$port, retrying... ($((INSTALL_RETRIES+1))/$MAX_INSTALL_RETRIES)"
              sleep 10
              INSTALL_RETRIES=$((INSTALL_RETRIES+1))
            done
            
            if [[ $INSTALL_RETRIES -eq $MAX_INSTALL_RETRIES ]]; then
              echo "❌ Failed to install APK on emulator-$port after $MAX_INSTALL_RETRIES attempts"
              exit 1
            fi
            
            echo "✅ APK installed successfully on emulator-$port"
          done

      - name: Prepare for UI tests
        run: |
          # Convert space-separated string to array
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            echo "🎭 Preparing emulator-$port for UI tests..."

            # Force-stop Google Maps and go to home screen
            adb -s emulator-$port shell pm disable-user --user 0 com.google.android.apps.maps || true
            adb -s emulator-$port shell input keyevent 3 || true

            # Wake up device and unlock
            for i in {1..2}; do
              echo "📱 Sending wakeup sequence to emulator-$port (attempt $i)..."
              adb -s emulator-$port shell input keyevent 224 2>/dev/null && sleep 1  # KEYCODE_BRIGHTNESS_UP
              adb -s emulator-$port shell input keyevent 82 2>/dev/null && sleep 1   # KEYCODE_MENU
              adb -s emulator-$port shell input keyevent 66 2>/dev/null && sleep 1   # KEYCODE_ENTER
              adb -s emulator-$port shell input keyevent 3 2>/dev/null && sleep 1    # KEYCODE_HOME
            done
            
            # Ensure we're on home screen
            adb -s emulator-$port shell am start -a android.intent.action.MAIN -c android.intent.category.HOME 2>/dev/null || true
            sleep 3
            
            # Log current focus state for debugging
            FOCUS_STATE=$(adb -s emulator-$port shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus|mFocusedApp" | head -2 || echo "Could not determine focus state")
            echo "Current focus state for emulator-$port: $FOCUS_STATE"
            
            echo "✅ emulator-$port prepared for testing"
          done
          
          sleep 10

      - name: Run instrumentation tests
        run: |
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          # Common Gradle parameters
          GRADLE_PARAMS=(
            "--build-cache"
            "-Pandroid.buildToolsVersion=${{ env.BUILD_TOOLS_VERSION }}"
            "-Pandroid.testInstrumentationRunnerArguments.notAnnotation=androidx.test.filters.LargeTest"
            "-Pandroid.experimental.androidTest.useUnifiedTestPlatform=true"
            "-Dorg.gradle.daemon=true"
            "-Dorg.gradle.parallel=true"
            "-Dorg.gradle.configureondemand=true"
            "-Dorg.gradle.caching=true"
            "-Dkotlin.incremental=true"
            "-Dorg.gradle.internal.http.socketTimeout=180000"
            "-Dorg.gradle.internal.http.connectionTimeout=120000"
            "--info"
          )
          if [[ ${#EMULATOR_PORTS_ARRAY[@]} -gt 1 ]]; then
            echo "Running tests sequentially on ${#EMULATOR_PORTS_ARRAY[@]} emulators..."
            for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
              echo "🧪 Running tests on emulator-$port..."
              ./gradlew connectedAndroidTest "${GRADLE_PARAMS[@]}" \
                -Dandroid.testInstrumentationRunnerArguments.deviceSerial="emulator-$port"
            done
          else
            echo "🧪 Running tests on single emulator..."
            ./gradlew connectedAndroidTest "${GRADLE_PARAMS[@]}" --parallel
          fi

      - name: Take screenshots
        if: always()
        run: |
          mkdir -p ${{ env.ARTIFACTS_BASE_PATH }}/screenshots
          
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          # API_LEVELS comes from ${{ inputs.api_level }}
          IFS=',' read -ra API_LEVELS_ARR_SS <<< "${API_LEVELS}"

          for idx in "${!EMULATOR_PORTS_ARRAY[@]}"; do
            port=${EMULATOR_PORTS_ARRAY[$idx]}
            current_api_level=${API_LEVELS_ARR_SS[$idx]:-${inputs.api_level}} # Fallback if array is misaligned, though it shouldn't be
            echo "📸 Taking screenshot from emulator-$port (API $current_api_level)..."
            echo "Timezone: $(adb -s emulator-$port shell getprop persist.sys.timezone)"
            echo "Language: $(adb -s emulator-$port shell getprop persist.sys.language)"
            echo "Country: $(adb -s emulator-$port shell getprop persist.sys.country)"
            echo "Locale: $(adb -s emulator-$port shell getprop persist.sys.locale)"
            adb -s emulator-$port exec-out screencap -p > "${{ env.ARTIFACTS_BASE_PATH }}/screenshots/emulator-api-${current_api_level}-port-${port}.png" 2>/dev/null || echo "Failed to capture screenshot from emulator-$port"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-multi-api
          path: ${{ env.ARTIFACTS_BASE_PATH }}/screenshots/*.png

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-multi-api
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 1

      - name: Stop emulators and cleanup
        if: always()
        run: |
          echo "🛑 Cleaning up emulators..."
          if [[ -n "${EMULATOR_PORTS_LIST:-}" ]]; then
            read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
            for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
              adb -s emulator-$port emu kill 2>/dev/null || echo "Emulator $port already stopped or not responding"
            done
          fi
          sleep 10
          pkill -f "emulator" 2>/dev/null || echo "No emulator processes found"
          adb kill-server 2>/dev/null || true
          echo "✅ Cleanup completed"