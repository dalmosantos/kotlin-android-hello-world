name: Android Multi-Version Test Template - Optimized

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
        description: 'Android version name'
      api_level:
        required: true
        type: number
        description: 'Android API level'
      pixel:
        required: true
        type: string
        description: 'Pixel device model'
      system_image:
        required: true
        type: string
        description: 'Android system image path'
      runner_type:
        required: true
        type: string
        description: 'GitHub runner type'
      architecture:
        required: true
        type: string
        description: 'CPU architecture'
      java_version:
        required: true
        type: string
        description: 'Java version'
      gradle_version:
        required: true
        type: string
        description: 'Gradle version'
      timezone:
        required: true
        type: string
        description: 'Timezone setting'
      language:
        required: true
        type: string
        description: 'Language setting'
      locale:
        required: true
        type: string
        description: 'Locale setting'
      max_parallel:
        required: true
        type: number
        description: 'Maximum parallel jobs'
      timeout-minutes:
        required: true
        type: number
        default: 60
        description: 'Timeout in minutes'
      commit_hash:
        required: false
        type: string
        default: ''
        description: 'Short commit hash for job naming'
      emulator_count:
        required: false
        type: number
        default: 1
        description: 'Number of emulators to start per runner (recommended: 1 for stability)'
      sequential_boot:
        required: false
        type: boolean
        default: true
        description: 'Boot emulators sequentially instead of simultaneously'

jobs:
  android_test:
    runs-on: ${{ inputs.runner_type }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel > 0 && inputs.max_parallel || 1 }}
      matrix:
        include:
          - dummy: value
    timeout-minutes: ${{ inputs.timeout-minutes }}
    name: ${{ inputs.commit_hash != '' && format('Test Android {0} (API {1}) - Pixel {2} - {3}', inputs.android_version, inputs.api_level, inputs.pixel, inputs.commit_hash) || format('Test Android {0} (API {1}) - Pixel {2}', inputs.android_version, inputs.api_level, inputs.pixel) }}

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ARTIFACTS_BASE_PATH: artifacts/${{ inputs.api_level }}
      TZ: ${{ inputs.timezone }}
      LANG: ${{ inputs.language }}
      LC_ALL: ${{ inputs.locale }}
      EMULATOR_COUNT: ${{ inputs.emulator_count }}
      MEMORY_SIZE: ${{ inputs.api_level <= 26 && '2048' || '3072' }}
      SEQUENTIAL_BOOT: ${{ inputs.sequential_boot }}
      
      # Performance optimizations for macOS
      ANDROID_EMULATOR_USE_SYSTEM_LIBS: 1
      ANDROID_EMULATOR_HVF: on
      ANDROID_EMULATOR_HYPERV: off
      ANDROID_EMULATOR_FORCE_32BIT: false
      QT_LOGGING_RULES: "*.debug=false"
      MALLOC_ARENA_MAX: 2
      
      # Gradle optimizations
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+UseStringDeduplication"
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      ANDROID_GRADLE_JOBS: ${{ inputs.runner_type == 'macos-13' && '4' || '2' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle with optimizations
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ inputs.gradle_version }}
          cache-read-only: false
          cache-write-only: false
          gradle-home-cache-cleanup: true

      - name: Enhanced cache for build performance
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/kotlin-dsl
            ${{ github.workspace }}/android-sdk
            ~/.android
            build/
            app/build/intermediates/
          key: ${{ runner.os }}-android-optimized-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}-${{ inputs.api_level }}-${{ inputs.gradle_version }}-v2
          restore-keys: |
            ${{ runner.os }}-android-optimized-${{ inputs.api_level }}-${{ inputs.gradle_version }}-
            ${{ runner.os }}-android-optimized-${{ inputs.api_level }}-
            ${{ runner.os }}-android-optimized-

      - name: System optimizations for macOS
        if: runner.os == 'macOS'
        run: |
          echo "🚀 Applying macOS performance optimizations..."
          
          # Disable Spotlight indexing for faster I/O
          sudo mdutil -a -i off 2>/dev/null || echo "Could not disable Spotlight indexing"
          
          # Optimize file descriptor limits
          ulimit -n 4096 2>/dev/null || echo "Could not set file descriptor limit"
          
          # Set optimal VM settings for Android emulation
          sudo sysctl -w vm.max_map_count=262144 2>/dev/null || true
          
          # Export macOS-specific emulator settings
          echo "DYLD_LIBRARY_PATH=$ANDROID_HOME/emulator/lib64:$ANDROID_HOME/emulator/lib64/qt/lib" >> $GITHUB_ENV
          
          echo "✅ macOS optimizations applied"

      - name: Install and configure Android SDK
        run: |
          echo "📦 Installing Android SDK with optimizations..."
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            url="https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            url="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          else
            echo "❌ Unsupported OS: $RUNNER_OS"
            exit 1
          fi
          
          curl -L -o sdk.zip "$url"
          unzip -q sdk.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator" >> $GITHUB_PATH
          
          echo "✅ Android SDK installed"

      - name: Detect and configure build tools
        id: buildtools
        run: |
          echo "🔧 Detecting optimal build-tools version..."
          api=${{ inputs.api_level }}
          
          # Get latest build-tools version for the API level
          build_tools_version=$(sdkmanager --list 2>/dev/null | grep -o "build-tools;[0-9.]*" | sed 's/build-tools;//' | sort -V | tail -1)
          
          if [[ -z "$build_tools_version" ]]; then
            # Fallback to API-specific version
            if [[ $api -ge 34 ]]; then
              build_tools_version="34.0.0"
            elif [[ $api -ge 33 ]]; then
              build_tools_version="33.0.2"
            elif [[ $api -ge 31 ]]; then
              build_tools_version="31.0.0"
            else
              build_tools_version="30.0.3"
            fi
          fi
          
          echo "BUILD_TOOLS_VERSION=$build_tools_version" >> $GITHUB_ENV
          echo "📋 Using build-tools: $build_tools_version for API $api"

      - name: Accept licenses and install SDK components
        run: |
          echo "📝 Accepting licenses and installing SDK components..."
          
          # Accept all licenses automatically
          printf "y\ny\ny\ny\ny\ny\ny\ny\n" | sdkmanager --licenses >/dev/null 2>&1
          
          # Install required components with error handling
          sdkmanager --update --channel=0
          
          components=(
            "tools"
            "build-tools;$BUILD_TOOLS_VERSION"
            "platform-tools" 
            "platforms;android-${{ inputs.api_level }}"
            "${{ inputs.system_image }}"
            "emulator"
          )
          
          for component in "${components[@]}"; do
            echo "Installing: $component"
            if ! sdkmanager --install "$component" --channel=0; then
              echo "⚠️  Failed to install $component, continuing..."
            fi
          done
          
          echo "✅ SDK components installed"

      - name: Optimize Gradle properties
        run: |
          echo "⚙️  Configuring Gradle for maximum performance..."
          
          # Create optimized gradle.properties
          cat > gradle.properties << EOF
          # Performance optimizations
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.configureondemand=true
          org.gradle.caching=true
          org.gradle.workers.max=$ANDROID_GRADLE_JOBS
          
          # Memory optimizations
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC
          
          # Android optimizations
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableR8.fullMode=true
          android.enableBuildCache=true
          android.experimental.cacheCompileLibResources=true
          android.experimental.enableSourceSetPathsMap=true
          android.builder.sdkDownload=true
          
          # Kotlin optimizations
          kotlin.incremental=true
          kotlin.incremental.android=true
          kotlin.caching.enabled=true
          kotlin.parallel.tasks.in.project=true
          
          # Build optimizations
          android.injected.build.api=${{ inputs.api_level }}
          android.buildToolsVersion=$BUILD_TOOLS_VERSION
          EOF
          
          echo "✅ Gradle optimizations configured"

      - name: Build project with optimizations
        run: |
          echo "🔨 Building project with performance optimizations..."
          set -euo pipefail
          
          # Pre-compile tasks for faster subsequent builds
          ./gradlew help --build-cache --configuration-cache || true
          
          # Main build with all optimizations
          ./gradlew assembleDebug assembleDebugAndroidTest \
            --build-cache \
            --configuration-cache \
            --parallel \
            --max-workers=$ANDROID_GRADLE_JOBS \
            --no-daemon \
            --profile \
            -Dorg.gradle.priority=high \
            -Pandroid.buildToolsVersion=$BUILD_TOOLS_VERSION \
            -Pandroid.compileSdkVersion=${{ inputs.api_level }} \
            -Pandroid.targetSdkVersion=${{ inputs.api_level }}
          
          echo "✅ Build completed successfully"

      - name: Create optimized AVDs
        run: |
          echo "📱 Creating high-performance AVDs..."
          
          # Generate emulator ports
          EMULATOR_PORTS_ARRAY=($(seq 5554 2 $((5554 + (EMULATOR_COUNT - 1) * 2))))
          
          for i in "${!EMULATOR_PORTS_ARRAY[@]}"; do
            port=${EMULATOR_PORTS_ARRAY[$i]}
            avd_name="test$i"
            echo "Creating optimized AVD: $avd_name for port: $port"
            
            # Create AVD with specific device profile
            echo "no" | avdmanager create avd -n "$avd_name" \
              -d "pixel_${{ inputs.pixel }}" \
              -k "${{ inputs.system_image }}" \
              --force
            
            # Configure AVD for maximum performance
            AVD_CONFIG="$HOME/.android/avd/${avd_name}.avd/config.ini"
            
            # Performance settings
            cat >> "$AVD_CONFIG" << EOF
          # Hardware acceleration and performance
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.ramSize=$MEMORY_SIZE
          vm.heapSize=256
          hw.cpu.ncore=2
          
          # Disable unnecessary features for faster boot
          hw.audioInput=no
          hw.audioOutput=no
          hw.camera.back=none
          hw.camera.front=none
          hw.gps=no
          hw.sensors.orientation=no
          hw.sensors.proximity=no
          hw.sensors.magneticField=no
          hw.sensors.gyroscope=no
          
          # Storage optimizations
          disk.dataPartition.size=4096MB
          hw.sdCard=no
          
          # Network optimizations
          hw.network.speed=full
          hw.network.latency=none
          
          # Boot optimizations
          fastboot.forceColdBoot=no
          fastboot.forceChosenSnapshotBoot=no
          fastboot.forceFastBoot=yes
          
          # Display optimizations
          hw.lcd.density=420
          hw.lcd.width=1080
          hw.lcd.height=2340
          EOF
          done
          
          # Export ports for other steps
          echo "EMULATOR_PORTS_LIST=${EMULATOR_PORTS_ARRAY[*]}" >> $GITHUB_ENV
          echo "✅ AVDs created and optimized"

      - name: Start high-performance emulators
        run: |
          echo "🚀 Starting optimized emulators..."
          set -euo pipefail
          
          adb start-server
          
          # Generate emulator ports
          EMULATOR_PORTS_ARRAY=($(seq 5554 2 $((5554 + (EMULATOR_COUNT - 1) * 2))))
          
          for i in "${!EMULATOR_PORTS_ARRAY[@]}"; do
            port=${EMULATOR_PORTS_ARRAY[$i]}
            avd_name="test$i"
            echo "Starting high-performance emulator $avd_name on port $port"
            
            # Advanced emulator parameters for maximum speed
            $ANDROID_HOME/emulator/emulator -avd "$avd_name" \
              -port $port \
              -no-window \
              -no-audio \
              -no-boot-anim \
              -no-snapshot \
              -wipe-data \
              -timezone ${{ inputs.timezone }} \
              -netdelay none \
              -netspeed full \
              -camera-back none \
              -camera-front none \
              -gpu swiftshader_indirect \
              -memory $MEMORY_SIZE \
              -cores 2 \
              -partition-size 4096 \
              -cache-size 1024 \
              -accel on \
              -engine qemu2 \
              -qemu -smp 2 \
              -qemu -m $MEMORY_SIZE \
              -qemu -cpu Haswell \
              -verbose > /tmp/emulator_$port.log 2>&1 &
            
            # Store PID for cleanup
            echo $! > /tmp/emulator_$port.pid
            
            # Stagger startup to avoid resource contention
            if [[ $SEQUENTIAL_BOOT == "true" && $i -lt $((${#EMULATOR_PORTS_ARRAY[@]} - 1)) ]]; then
              echo "⏳ Waiting 20 seconds before starting next emulator..."
              sleep 20
            fi
          done
          
          echo "EMULATOR_PORTS_LIST=${EMULATOR_PORTS_ARRAY[*]}" >> $GITHUB_ENV
          echo "✅ All emulators started"

      - name: Parallel boot detection and optimization
        timeout-minutes: 10
        run: |
          echo "⏳ Waiting for emulators with parallel detection..."
          set -euo pipefail
          
          MAX_ATTEMPTS=25
          SLEEP_SECONDS=12
          
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          echo "Monitoring ${#EMULATOR_PORTS_ARRAY[@]} emulator(s) for boot completion..."
          
          # Parallel boot detection for faster response
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            (
              echo "🔍 Monitoring emulator-$port..."
              n=0
              
              until [[ $n -ge $MAX_ATTEMPTS ]]; do
                if adb -s emulator-$port shell true 2>/dev/null; then
                  boot_completed=$(adb -s emulator-$port shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "0")
                  
                  if [[ "$boot_completed" == "1" ]]; then
                    echo "✅ Emulator $port ready in $((n * SLEEP_SECONDS)) seconds!"
                    
                    # Immediate post-boot optimizations
                    adb -s emulator-$port shell settings put global window_animation_scale 0 2>/dev/null &
                    adb -s emulator-$port shell settings put global transition_animation_scale 0  2>/dev/null &
                    adb -s emulator-$port shell settings put global animator_duration_scale 0 2>/dev/null &
                    adb -s emulator-$port shell input keyevent 82 2>/dev/null & # Unlock
                    adb -s emulator-$port shell input keyevent 4 2>/dev/null &  # Back to home
                    
                    exit 0
                  fi
                fi
                
                sleep $SLEEP_SECONDS
                n=$((n+1))
                
                # Progress indicator every 3 attempts
                if [[ $((n % 3)) -eq 0 ]]; then
                  echo "⏳ Emulator $port still booting... ($((n * SLEEP_SECONDS))s elapsed)"
                fi
              done
              
              echo "❌ Emulator $port failed to boot within timeout"
              # Show diagnostic info
              cat /tmp/emulator_$port.log 2>/dev/null | tail -20 || echo "No log available"
              exit 1
            ) &
          done
          
          # Wait for all parallel processes
          wait
          echo "🎉 All emulators ready and optimized!"

      - name: Advanced emulator configuration
        run: |
          echo "⚙️  Applying advanced configurations..."
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          # Parallel configuration for speed
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            (
              echo "🔧 Configuring emulator-$port..."
              
              # Batch all settings in a single shell session
              adb -s emulator-$port shell << 'EOF'
          # Animation settings
          settings put global window_animation_scale 0
          settings put global transition_animation_scale 0  
          settings put global animator_duration_scale 0
          
          # API and security settings
          settings put global hidden_api_policy 1
          settings put global hidden_api_policy_pre_p_apps 1
          settings put global hidden_api_policy_p_apps 1
          
          # Power and display settings
          settings put system screen_off_timeout 1800000
          svc power stayon true
          
          # Testing optimizations
          settings put global force_resizable_activities 1
          settings put global enable_freeform_support 1
          settings put global development_settings_enabled 1
          
          # Performance settings
          settings put global activity_manager_constants max_cached_processes=16
          
          # Navigation and input
          input keyevent 82
          input keyevent 4
          am start -a android.intent.action.MAIN -c android.intent.category.HOME
          EOF
              
              echo "✅ emulator-$port configured"
            ) &
          done
          
          wait
          echo "✨ All emulator configurations completed!"

      - name: Optimized APK installation
        timeout-minutes: 5
        run: |
          echo "📦 Installing APKs with optimization..."
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          # Parallel APK installation
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            (
              echo "📱 Installing APK on emulator-$port..."
              
              # Try fast deployment first, fallback to standard
              if adb -s emulator-$port install -r -t --fastdeploy app/build/outputs/apk/debug/app-debug.apk 2>/dev/null; then
                echo "✅ Fast deployment successful on emulator-$port"
              elif adb -s emulator-$port install -r -g app/build/outputs/apk/debug/app-debug.apk; then
                echo "✅ Standard installation successful on emulator-$port"
              else
                echo "❌ Failed to install APK on emulator-$port"
                exit 1
              fi
              
              # Install test APK
              if [[ -f "app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" ]]; then
                adb -s emulator-$port install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk 2>/dev/null || echo "Test APK install failed, will use connectedAndroidTest"
              fi
            ) &
          done
          
          wait
          echo "✅ All APKs installed successfully"

      - name: Pre-test system optimization
        run: |
          echo "🚀 Pre-test system optimizations..."
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            (
              echo "⚡ Optimizing emulator-$port for testing..."
              
              # Pre-compile apps for faster execution
              adb -s emulator-$port shell cmd package compile -m speed-profile -a 2>/dev/null &
              
              # Clear potential issues
              adb -s emulator-$port shell am kill-all 2>/dev/null || true
              
              # Optimize memory
              adb -s emulator-$port shell am start -a android.intent.action.MAIN -c android.intent.category.HOME 2>/dev/null
              adb -s emulator-$port shell input keyevent 3 2>/dev/null # Ensure home
              
              # Final device state check
              android_version=$(adb -s emulator-$port shell getprop ro.build.version.release 2>/dev/null || echo "unknown")
              api_level=$(adb -s emulator-$port shell getprop ro.build.version.sdk 2>/dev/null || echo "unknown")
              echo "📱 Emulator $port ready: Android $android_version (API $api_level)"
            ) &
          done
          
          wait
          echo "✅ All emulators optimized for testing"

      - name: Run optimized instrumentation tests
        run: |
          echo "🧪 Running instrumentation tests with optimizations..."
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          # Enhanced Gradle parameters for testing
          GRADLE_TEST_PARAMS=(
            "--build-cache"
            "--configuration-cache"
            "--parallel"
            "--max-workers=$ANDROID_GRADLE_JOBS"
            "--no-daemon"
            "-Pandroid.buildToolsVersion=$BUILD_TOOLS_VERSION"
            "-Pandroid.testInstrumentationRunnerArguments.notAnnotation=androidx.test.filters.LargeTest"
            "-Pandroid.experimental.androidTest.useUnifiedTestPlatform=true"
            "-Pandroid.experimental.androidTest.orchestrator=false"
            "-Pandroid.testInstrumentationRunnerArguments.clearPackageData=true"
            "-Dorg.gradle.daemon=false"
            "-Dorg.gradle.parallel=true"
            "-Dorg.gradle.configureondemand=true"
            "-Dorg.gradle.caching=true"
            "-Dkotlin.incremental=true"
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
            "-Dorg.gradle.internal.http.socketTimeout=300000"
            "-Dorg.gradle.internal.http.connectionTimeout=180000"
            "--info"
          )
          
          if [[ ${#EMULATOR_PORTS_ARRAY[@]} -gt 1 ]]; then
            echo "🔄 Running tests sequentially on ${#EMULATOR_PORTS_ARRAY[@]} emulators for stability..."
            for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
              echo "🧪 Running tests on emulator-$port..."
              ./gradlew connectedAndroidTest "${GRADLE_TEST_PARAMS[@]}" \
                -Dandroid.testInstrumentationRunnerArguments.deviceSerial=emulator-$port \
                -Pandroid.testInstrumentationRunnerArguments.useTestStorageService=true
            done
          else
            echo "🧪 Running tests on single emulator with full parallelization..."
            ./gradlew connectedAndroidTest "${GRADLE_TEST_PARAMS[@]}" \
              -Pandroid.testInstrumentationRunnerArguments.useTestStorageService=true
          fi
          
          echo "✅ All tests completed successfully"

      - name: Capture diagnostics and screenshots
        if: always()
        run: |
          echo "📸 Capturing final state and screenshots..."
          mkdir -p ${{ env.ARTIFACTS_BASE_PATH }}/screenshots
          mkdir -p ${{ env.ARTIFACTS_BASE_PATH }}/logs
          
          read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
          
          for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
            echo "📸 Capturing diagnostics from emulator-$port..."
            
            # Screenshot
            adb -s emulator-$port exec-out screencap -p > ${{ env.ARTIFACTS_BASE_PATH }}/screenshots/final-emulator-${{ inputs.api_level }}-$port.png 2>/dev/null || echo "Screenshot failed for $port"
            
            # System info
            {
              echo "=== Device Info ==="
              adb -s emulator-$port shell getprop ro.build.version.release 2>/dev/null || echo "unknown"
              adb -s emulator-$port shell getprop ro.build.version.sdk 2>/dev/null || echo "unknown"
              
              echo "=== Memory Info ==="
              adb -s emulator-$port shell cat /proc/meminfo 2>/dev/null | head -5 || echo "Memory info unavailable"
              
              echo "=== Running Processes ==="
              adb -s emulator-$port shell ps | head -10 2>/dev/null || echo "Process list unavailable"
            } > ${{ env.ARTIFACTS_BASE_PATH }}/logs/emulator-$port-info.txt 2>/dev/null
            
            # Copy emulator logs if available
            if [[ -f "/tmp/emulator_$port.log" ]]; then
              cp /tmp/emulator_$port.log ${{ env.ARTIFACTS_BASE_PATH }}/logs/ 2>/dev/null || true
            fi
          done
          
          echo "✅ Diagnostics captured"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-${{ inputs.api_level }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARTIFACTS_BASE_PATH }}/
            app/build/reports/
            app/build/outputs/androidTest-results/
            build/reports/profile/
          retention-days: 3
          compression-level: 6

      - name: Comprehensive cleanup
        if: always()
        run: |
          echo "🧹 Performing comprehensive cleanup..."
          
          # Stop all emulators gracefully
          if [[ -n "${EMULATOR_PORTS_LIST:-}" ]]; then
            read -ra EMULATOR_PORTS_ARRAY <<< "$EMULATOR_PORTS_LIST"
            for port in "${EMULATOR_PORTS_ARRAY[@]}"; do
              echo "🛑 Stopping emulator-$port..."
              adb -s emulator-$port emu kill 2>/dev/null || echo "Emulator $port already stopped"
              
              # Kill by PID if available
              if [[ -f "/tmp/emulator_$port.pid" ]]; then
                pid=$(cat /tmp/emulator_$port.pid 2>/dev/null || echo "")
                [[ -n "$pid" ]] && kill -TERM "$pid" 2>/dev/null || true
              fi
            done
          fi
          
          # Wait for graceful shutdown
          sleep 15
          
          # Force kill any remaining emulator processes
          pkill -f "qemu-system" 2>/dev/null || true
          pkill -f "emulator64" 2>/dev/null || true
          pkill -f "emulator" 2>/dev/null || true
          
          # Stop ADB server
          adb kill-server 2>/dev/null || true
          
          # Cleanup temporary files and directories
          rm -rf /tmp/emulator_*.log /tmp/emulator_*.pid 2>/dev/null || true
          rm -rf $TMPDIR/avd_data_* 2>/dev/null || true
          rm -rf ~/.android/avd/test* 2>/dev/null || true
          
          # Re-enable Spotlight indexing if we disabled it
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sudo mdutil -a -i on 2>/dev/null || echo "Could not re-enable Spotlight indexing"
          fi
          
          echo "✅ Cleanup completed successfully"