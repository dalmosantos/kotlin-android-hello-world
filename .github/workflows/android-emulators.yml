name: Android Emulators

on: [push, pull_request]

jobs:
  android-emulator-test:
    runs-on: macos-13
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      TZ: America/Sao_Paulo
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ARTIFACTS_BASE_PATH: artifacts/${{ matrix.android-version.api }}
      SYSTEM_IMAGE: google_apis;x86_64

    strategy:
      matrix:
        android-version: [
          # { api: 24, name: "7" },
          # { api: 26, name: "8" },
          # { api: 28, name: "9" },
          # { api: 29, name: "10" },
          # { api: 30, name: "11" },
          # { api: 31, name: "12" },
          { api: 33, name: "13" },
          { api: 34, name: "14" },
          { api: 35, name: "15" }
        ]
      fail-fast: false

    name: android-emulator-test {version:${{ matrix.android-version.name }},api:${{ matrix.android-version.api }}}

    defaults:
      run:
        shell: bash

    steps:
      - name: Set SYSTEM_IMAGE based on architecture
        run: |
          ARCHITECTURE=$(uname -m)
          echo "# --- Detected architecture: $ARCHITECTURE ---#"
          if [ "$ARCHITECTURE" == "x86_64" ]; then
            echo "SYSTEM_IMAGE=google_apis;x86_64" >> $GITHUB_ENV
          elif [ "$ARCHITECTURE" == "arm64" ]; then
            echo "SYSTEM_IMAGE=google_apis_playstore;arm64-v8a" >> $GITHUB_ENV
          else
            echo "Unsupported architecture: $ARCHITECTURE"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK
        timeout-minutes: 15
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          page_url="https://developer.android.com/studio#command-tools"
          latest_url=$(curl -s $page_url | grep -oE 'https:\/\/dl\.google\.com\/android\/repository\/commandlinetools-mac-[0-9]+_latest\.zip' | head -n 1)
          if [ -z "$latest_url" ]; then
            echo "Failed to fetch the latest command-line tools URL."
            exit 1
          fi
          curl -o cmdline-tools.zip $latest_url
          unzip cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Detect latest build-tools version
        id: detect_build_tools
        run: |
          latest_version=$(sdkmanager --list | grep -o 'build-tools;[0-9]\+\.[0-9]\+\.[0-9]\+' | sed 's/build-tools;//' | sort -V | tail -1)
          if [ -z "$latest_version" ]; then
            echo "Could not determine the latest build-tools version."
            exit 1
          fi
          echo "Latest detected build-tools version: $latest_version"
          echo "BUILD_TOOLS_VERSION=$latest_version" >> $GITHUB_ENV
  
      - name: Accept licenses and install SDK components
        timeout-minutes: 15
        run: |
          printf "y\ny\ny\ny\ny\ny\ny\ny\n" | sdkmanager --licenses
          sdkmanager --update
          sdkmanager --install \
            "tools" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "platform-tools" \
            "platforms;android-${{ matrix.android-version.api }}" \
            "system-images;android-${{ matrix.android-version.api }};${{ env.SYSTEM_IMAGE }}" \
            "emulator"

      # - name: Write entitlements and qemu install
      #   run: |
      #     brew upgrade && brew install qemu
      #     # chmod +x .github/scripts/write_entitlements.sh
      #     # .github/scripts/write_entitlements.sh
    

      - name: Build the project
        run: |
          unset ANDROID_SDK_ROOT
          ./gradlew build --no-daemon -Pandroid.buildToolsVersion=${{ env.BUILD_TOOLS_VERSION }}

      - name: Create AVD
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "Creating AVD..."
          echo "no" | avdmanager create avd -n test \
            -k "system-images;android-${{ matrix.android-version.api }};${{ env.SYSTEM_IMAGE }}" --force

          list_avds=$(emulator -list-avds)
          if [[ -z "$list_avds" ]]; then
            echo "Error: No AVDs found. Please ensure at least one AVD is configured."
            exit 1
          fi
          echo "Available AVDs:" $list_avds

          # Define memory size based on API level
          if [ ${{ matrix.android-version.api }} -eq 24 ]; then
            echo "AVD configured with memory size: 2048MB"
            echo "MEMORY_SIZE=2048" >> $GITHUB_ENV
          else
            echo "AVD configured with memory size: 3072MB"
            echo "MEMORY_SIZE=3072" >> $GITHUB_ENV
          fi

      - name: Start Emulator and Setup ADB
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export ANDROID_EMULATOR_USE_SYSTEM_LIBS=1

          echo "Starting emulator..."
          $ANDROID_HOME/emulator/emulator \
            -avd test \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel auto \
            -no-audio \
            -no-boot-anim \
            -no-window \
            -memory $MEMORY_SIZE \
            -verbose \
            -cores 2 &
  
          # Adjust ADB_SERVER_PORT: start at 5037 and skip two port numbers until a free port is found
          start_port=5037
          port=$start_port
          while lsof -i :$port; do
            echo "Port $port is occupied, checking port $((port+2))..."
            port=$((port+2))
          done
          echo "Using port $port for ADB."
          export ADB_SERVER_PORT=$port

          adb start-server
          adb devices
          adb wait-for-device      
  
          # Registra o PID do emulador em variável de ambiente, se necessário para steps seguintes
          EMULATOR_PID=$!
          echo "Emulator PID: $EMULATOR_PID"

          
      - name: Wait for emulator boot completion
        timeout-minutes: 10
        run: |
            # Configuration
            MAX_ATTEMPTS=10
            SLEEP_INTERVAL=15
  
            # Function to check emulator boot status
            is_emulator_booted() {
                adb shell getprop sys.boot_completed 2>/dev/null || echo 0
            }
  
            # Wait for emulator to boot
            for ((attempt=1; attempt <= MAX_ATTEMPTS; attempt++)); do
                if [ "$(is_emulator_booted)" == "1" ]; then
                    echo "Emulator booted successfully!"
                    break
                fi
                echo "Waiting for emulator... Attempt $attempt of $MAX_ATTEMPTS"
                sleep $SLEEP_INTERVAL
            done
  
            # Check final boot status
            if [ "$(is_emulator_booted)" != "1" ]; then
                echo "Emulator failed to boot within timeout."
                exit 1
            fi
  
            # Unlock the emulator screen
            adb shell input keyevent 82

      - name: Upload APK to emulator
        run: |
          adb install app/build/outputs/apk/debug/app-debug.apk

      - name: Run instrumentation tests
        run: |
          unset ANDROID_SDK_ROOT
          ./gradlew connectedAndroidTest --no-daemon --parallel

      - name: Capture emulator screenshot
        if: always()
        run: |
          mkdir -p ${{ env.ARTIFACTS_BASE_PATH }}/screenshots
          adb exec-out screencap -p > ${{ env.ARTIFACTS_BASE_PATH }}/screenshots/emulator-screenshot-${{ matrix.android-version.api }}.png

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot-android-${{ matrix.android-version.api }}
          path: ${{ env.ARTIFACTS_BASE_PATH }}/screenshots/*.png

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-${{ matrix.android-version.api }}
          path: |
            ${{ env.ARTIFACTS_BASE_PATH }}/results/**/build/reports/
            ${{ env.ARTIFACTS_BASE_PATH }}/results/**/build/outputs/androidTest-results/
          retention-days: 1

      - name: Clean up and stop emulator
        if: always()
        run: |
          adb emu kill || echo "Emulator already stopped"
          rm -rf $ANDROID_HOME
          echo "Cleaning workspace..."
          rm -rf ${{ github.workspace }}/*