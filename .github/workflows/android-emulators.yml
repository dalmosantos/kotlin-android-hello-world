name: Android Emulator CI

on: [push, pull_request]

jobs:
  android-emulator-test:
    runs-on: macos-13
    timeout-minutes: 45  # Reduced from 60 as we're optimizing the workflow

    strategy:
      fail-fast: false
      matrix:
        android-version: [
          # { api: 24, name: "7.0", pixel: "xl" },
          # { api: 26, name: "8.0", pixel: "2" },
          # { api: 28, name: "9", pixel: "3a" },
          # { api: 29, name: "10", pixel: "4a" },
          { api: 30, name: "11", pixel: "5" },
          { api: 31, name: "12", pixel: "6a" },
          { api: 33, name: "13", pixel: "7a" },
          { api: 34, name: "14", pixel: "8a" },
          { api: 35, name: "15", pixel: "8a" }
        ]

    name: Android Emulator Test - API ${{ matrix.android-version.api }}

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ARTIFACTS_BASE_PATH: artifacts/${{ matrix.android-version.api }}
      TZ: America/Sao_Paulo
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # Reduce emulator resource requirements
      EMULATOR_MEMORY: 2048
      # Disable unneeded features
      EMULATOR_DISABLE_FEATURES: "PlayStore,GpuWatch,EncryptUserData,MultiDisplay"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle and Android SDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-



      # Parallel operations: Install Android SDK and Build Project
      - name: Install Android SDK and Build Project
        run: |
          # Create directories
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          # Start building project in background while SDK is installing
          (./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --parallel &)
          
          # Download and install command line tools
          url=$(curl -s https://developer.android.com/studio#command-tools | grep -oE 'https://dl.google.com/android/repository/commandlinetools-mac-[0-9]+_latest.zip' | head -1)
          curl -o sdk.zip "$url" --silent
          unzip -q sdk.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator" >> $GITHUB_PATH
          
          # Detect latest build tools
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          version=$(sdkmanager --list 2>/dev/null | grep -o 'build-tools;[0-9.]*' | sed 's/build-tools;//' | sort -V | tail -1)
          echo "BUILD_TOOLS_VERSION=$version" >> $GITHUB_ENV
          
          # Determine system image based on architecture
          arch=$(uname -m)
          api=${{ matrix.android-version.api }}
          if [[ "$arch" == "x86_64" && "$api" -lt 30 ]]; then
            echo "SYSTEM_IMAGE=google_apis;x86_64" >> $GITHUB_ENV
          elif [[ "$arch" == "x86_64" ]]; then
            echo "SYSTEM_IMAGE=google_apis_playstore;x86_64" >> $GITHUB_ENV
          elif [[ "$arch" == "arm64" || "$arch" == "aarch64" ]]; then
            echo "SYSTEM_IMAGE=google_apis_playstore;arm64-v8a" >> $GITHUB_ENV
          else
            echo "Unsupported architecture: $arch"
            exit 1
          fi
          
          # Accept licenses silently and install only required SDK components
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install \
            "platform-tools" \
            "build-tools;$version" \
            "platforms;android-${{ matrix.android-version.api }}" \
            "system-images;android-${{ matrix.android-version.api }};$SYSTEM_IMAGE" \
            "emulator" \
            --verbose
          
          # Wait for Gradle build to finish
          wait
          echo "✅ SDK installation and project build completed"

      - name: Create optimized AVD
        run: |
          echo "no" | avdmanager create avd -n test \
            -d "pixel_${{ matrix.android-version.pixel }}" \
            -k "system-images;android-${{ matrix.android-version.api }};${{ env.SYSTEM_IMAGE }}" \
            --force
          
          # Apply performance optimizations to AVD config
          CONFIG_PATH="$HOME/.android/avd/test.avd/config.ini"
          echo "Optimizing AVD configuration at $CONFIG_PATH"
          
          # Hardware acceleration
          echo "hw.accelerometer=no" >> $CONFIG_PATH
          echo "hw.audioInput=no" >> $CONFIG_PATH
          echo "hw.audioOutput=no" >> $CONFIG_PATH
          echo "hw.battery=no" >> $CONFIG_PATH
          echo "hw.gps=no" >> $CONFIG_PATH
          echo "hw.camera.front=no" >> $CONFIG_PATH
          echo "hw.camera.back=no" >> $CONFIG_PATH
          echo "hw.lcd.density=240" >> $CONFIG_PATH
          echo "hw.lcd.width=768" >> $CONFIG_PATH
          echo "hw.lcd.height=1280" >> $CONFIG_PATH
          echo "hw.sensor.proximity=no" >> $CONFIG_PATH
          
          # RAM optimizations
          echo "hw.ramSize=${{ env.EMULATOR_MEMORY }}" >> $CONFIG_PATH
          
          # Disk optimizations
          echo "disk.dataPartition.size=2048M" >> $CONFIG_PATH
          echo "disk.cachePartition.size=512M" >> $CONFIG_PATH
          
          # Graphics optimizations
          echo "hw.gpu.enabled=yes" >> $CONFIG_PATH
          echo "hw.gpu.mode=swiftshader" >> $CONFIG_PATH
          
          cat $CONFIG_PATH
          echo "✅ AVD creation and optimization completed"
      
      - name: Start emulator with optimizations
        run: |
          set -euo pipefail
          
          # Start ADB server early
          adb start-server
          
          # Prepare emulator parameters
          EMULATOR_PARAMS=(
            "-avd" "test"
            "-no-audio"
            "-no-boot-anim"
            "-no-window"
            "-timezone" "America/Sao_Paulo"
            "-gpu" "swiftshader"
            "-memory" "${{ env.EMULATOR_MEMORY }}"
            "-wipe-data"  # Ensure clean state
            "-no-cache"  # Disable cache to reduce disk I/O
            "-partition-size" "2048"
            "-cache-size" "512"
            "-no-jni"
            "-feature" "-${{ env.EMULATOR_DISABLE_FEATURES }}"
            "-qemu" "-smp" "2"  # Reduced cores for faster startup
          )
          
          # Start emulator with determined parameters
          echo "Starting emulator with optimized parameters..."
          $ANDROID_HOME/emulator/emulator "${EMULATOR_PARAMS[@]}" &
          EMU_PID=$!
          
          # Save PID for later cleanup
          echo "EMULATOR_PID=$EMU_PID" >> $GITHUB_ENV
          echo "✅ Emulator started with PID $EMU_PID"
        
      - name: Accelerated emulator boot
        timeout-minutes: 4  # Reduced timeout for boot
        run: |
          set -euo pipefail
          
          # Define faster polling strategy
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=6
          BOOT_COMPLETE_PROP="sys.boot_completed"
          LOGCAT_FILE="${{ env.ARTIFACTS_BASE_PATH }}/boot-logcat.txt"
          
          # Create directory for log file
          mkdir -p "$(dirname "$LOGCAT_FILE")"
          
          # Start capturing logcat output (with filtering)
          adb logcat -v brief -b main -b system | grep -E 'ActivityManager|boot|system_server' > "$LOGCAT_FILE" &
          LOGCAT_PID=$!
          
          echo "Accelerating boot by optimizing system services..."
          
          # Fast polling for device detection
          wait_for_device() {
            for ((i=1; i<=10; i++)); do
              if adb devices | grep -q "emulator"; then
                echo "✅ Device connected after $i attempts"
                return 0
              fi
              echo "⏳ Waiting for device to connect... ($i/10)"
              sleep 2
            done
            return 1
          }
          
          # Fast boot strategy
          wait_for_boot() {
            local start_time=$(date +%s)
            for ((i=1; i<=MAX_ATTEMPTS; i++)); do
              if adb shell getprop "$BOOT_COMPLETE_PROP" 2>/dev/null | grep -q 1; then
                local end_time=$(date +%s)
                local duration=$((end_time-start_time))
                echo "✅ Emulator booted in $duration seconds"
                return 0
              fi
              
              # Every 5 attempts, try to unblock boot
              if (( i % 5 == 0 )); then
                echo "🔄 Sending boot accelerator commands..."
                # Send hardware key events to potentially unblock boot
                adb shell input keyevent 82 &>/dev/null || true
                adb shell settings put global window_animation_scale 0.0 &>/dev/null || true
                adb shell settings put global transition_animation_scale 0.0 &>/dev/null || true
                adb shell settings put global animator_duration_scale 0.0 &>/dev/null || true
              fi
              
              echo "⏳ Waiting for boot completion... (Attempt $i/$MAX_ATTEMPTS)"
              sleep $SLEEP_SECONDS
            done
            return 1
          }
          
          wait_for_device
          if wait_for_boot; then
            # Print Android version for verification
            android_version=$(adb shell getprop ro.build.version.release)
            echo "# ----- 📱 Android $android_version booted successfully -----"
            

          else
            echo "❌ Emulator failed to boot in the allocated time"
            echo "🔍 Boot log diagnostic information:"
            tail -n 50 "$LOGCAT_FILE" | grep -i -E "error|fail|fatal|crash"
            # Attempt emergency restart of the emulator
            echo "🔄 Attempting emergency restart of the emulator..."
            adb emu kill || true
            sleep 5
            # Start with absolute minimum configuration
            $ANDROID_HOME/emulator/emulator -avd test -no-window -wipe-data -memory 1536 -gpu swiftshader -no-audio &
            sleep 30
            if ! adb shell getprop "$BOOT_COMPLETE_PROP" 2>/dev/null | grep -q 1; then
              kill $LOGCAT_PID || true
              exit 1
            fi
          fi
          
          # Stop logcat capture
          kill $LOGCAT_PID || true
          echo "✅ Boot process completed"
        
      - name: Fast system configuration
        run: |
          echo "🔧 Applying minimal system configuration..."
          
          # Use a parallelized approach for faster configuration
          (adb shell settings put global window_animation_scale 0 &)
          (adb shell settings put global transition_animation_scale 0 &)
          (adb shell settings put global animator_duration_scale 0 &)
          (adb shell settings put global hidden_api_policy 1 &)
          (adb shell settings put global force_resizable_activities 1 &)
          (adb shell svc power stayon true &)
          
          # Wait for all background processes to complete
          wait
          
          # Verify configuration applied correctly
          echo "✅ System configuration complete"
            
      - name: Install and test APK
        timeout-minutes: 4
        run: |
          # Install and test in parallel where possible
          echo "📱 Installing and testing APK..."
          
          # Unlock screen in background
          (adb shell input keyevent 82 && adb shell input keyevent 66) &
          
          # Install APK with optimized parameters
          adb install -g -d app/build/outputs/apk/debug/app-debug.apk
          
          # Wait for unlock to complete
          wait
          
          # Launch to home before testing
          adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME
          sleep 3  # Reduced sleep time
          
          # Run instrumentation tests with optimized parameters
          ./gradlew connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments.disableAnalytics=true --no-daemon --parallel
          
          echo "✅ Testing completed"

      - name: Capture results
        if: always()
        run: |
          mkdir -p ${{ env.ARTIFACTS_BASE_PATH }}/screenshots
          adb exec-out screencap -p > ${{ env.ARTIFACTS_BASE_PATH }}/screenshots/emulator-${{ matrix.android-version.api }}.png
          echo "✅ Results captured"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-${{ matrix.android-version.api }}
          path: |
            ${{ env.ARTIFACTS_BASE_PATH }}/screenshots/*.png
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 1

      - name: Clean shutdown
        if: always()
        run: |
          # Proper cleanup to avoid hung processes
          if [[ -n "${EMULATOR_PID:-}" ]]; then
            echo "Terminating emulator process $EMULATOR_PID"
            kill $EMULATOR_PID || true
          fi
          
          # Ensure ADB is terminated
          adb emu kill || true
          adb kill-server || true
          
          # Remove heavy directories to free up space
          rm -rf $ANDROID_HOME
          rm -rf ~/.android/avd/test.avd
          echo "✅ Environment cleaned up"