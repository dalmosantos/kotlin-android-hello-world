name: Android Emulator CI (Fast Boot)

on: [push, pull_request]

jobs:
  android-emulator-test:
    runs-on: macos-13
    timeout-minutes: 25  # Reduzido devido às otimizações

    strategy:
      fail-fast: false
      matrix:
        android-version: [
          { api: 30, name: "11", pixel: "5" },
          { api: 31, name: "12", pixel: "6a" }, 
          { api: 33, name: "13", pixel: "7a" },
          { api: 34, name: "14", pixel: "8a" },
          { api: 35, name: "15", pixel: "8a" }
        ]

    name: Android Test - API ${{ matrix.android-version.api }}

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ARTIFACTS_BASE_PATH: artifacts/${{ matrix.android-version.api }}
      TZ: America/Sao_Paulo
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/avd
            ~/.android/cache
          key: ${{ runner.os }}-android-${{ matrix.android-version.api }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-${{ matrix.android-version.api }}-
            ${{ runner.os }}-android-

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-mac-9477386_latest.zip
          unzip sdk.zip -d $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Install SDK components
        run: |
          printf "y\ny\ny\ny\ny\ny\ny\ny\n" | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "emulator"
          sdkmanager --install "platforms;android-${{ matrix.android-version.api }}"
          sdkmanager --install "system-images;android-${{ matrix.android-version.api }};${{ env.SYSTEM_IMAGE }}"

      - name: Configure AVD
        run: |
          MEMORY_SIZE=3072
          echo "MEMORY_SIZE=$MEMORY_SIZE" >> $GITHUB_ENV

          echo "no" | avdmanager create avd -n test \
            -d "pixel_${{ matrix.android-version.pixel }}" \
            -k "system-images;android-${{ matrix.android-version.api }};${{ env.SYSTEM_IMAGE }}" \
            --force

          CONFIG_PATH="$HOME/.android/avd/test.avd/config.ini"
          cat <<EOF >> $CONFIG_PATH
          hw.ramSize=$MEMORY_SIZE
          hw.gpu.enabled=yes
          hw.gpu.mode=auto
          hw.keyboard=yes
          hw.mainKeys=no
          hw.camera.back=none
          hw.camera.front=none
          vm.heapSize=256
          disk.dataPartition.size=2G
          fastboot.forceFastBoot=yes
          fastboot.forceChosenSnapshotBoot=yes
          EOF

      - name: Create boot snapshot
        if: ${{ !steps.cache-deps.outputs.cache-hit }}
        run: |
          echo "Creating optimized boot snapshot..."
          $ANDROID_HOME/emulator/emulator -avd test \
            -no-snapshot-load \
            -no-snapshot-save \
            -wipe-data \
            -gpu swiftshader_indirect \
            -memory $MEMORY_SIZE \
            -no-audio \
            -no-boot-anim \
            -no-window \
            -qemu -smp 4 \
            -accel on \
            -quit-after-boot 180 &

          # Wait for snapshot creation
          for i in {1..36}; do
            if [[ -f ~/.android/avd/test.avd/snapshots/default_boot/ram.img ]]; then
              echo "Snapshot created successfully"
              pkill -f emulator || true
              exit 0
            fi
            sleep 5
          done
          echo "Failed to create snapshot"
          exit 1

      - name: Start emulator from snapshot
        run: |
          $ANDROID_HOME/emulator/emulator -avd test \
            -snapshot default_boot \
            -no-snapshot-save \
            -no-audio \
            -no-boot-anim \
            -no-window \
            -gpu swiftshader_indirect \
            -memory $MEMORY_SIZE \
            -qemu -smp 4 \
            -accel on &

      - name: Wait for emulator
        timeout-minutes: 3
        run: |
          adb wait-for-device
          echo "Device connected, waiting for boot completion..."
          
          for i in {1..18}; do
            if adb shell getprop sys.boot_completed | grep -q 1 && \
               adb shell pm list packages 2>/dev/null | grep -q 'package:android'; then
              echo "Emulator ready in $((i*10)) seconds"
              adb shell input keyevent 82
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 10
          done
          
          echo "Timeout waiting for emulator"
          adb emu kill || true
          exit 1

      - name: Build and test
        run: |
          ./gradlew assembleDebug connectedAndroidTest --no-daemon

      - name: Collect artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-${{ matrix.android-version.api }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            ${{ env.ARTIFACTS_BASE_PATH }}/

      - name: Cleanup
        if: always()
        run: |
          adb emu kill || true
          rm -rf $ANDROID_HOME