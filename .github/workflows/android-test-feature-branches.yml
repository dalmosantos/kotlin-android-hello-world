name: CI - Feature Branches

on:
  workflow_call:
    inputs:
      android_version:
        type: string
        default: '13'
      api_level:
        type: number
        default: 33
      pixel:
        type: string
        default: '7a'
      runner_type:
        type: string
        default: 'macos-13'
      architecture:
        type: string
        default: 'x86_64'
      java_version:
        type: string
        default: '17'
      gradle_version:
        type: string
        default: '8.12.1'
      timezone:
        type: string
        default: 'America/Sao_Paulo'
      language:
        type: string
        default: 'en_US.UTF-8'
      locale:
        type: string
        default: 'en_US.UTF-8'
      max_parallel:
        type: number
        default: 1
      timeout_minutes:
        type: number
        default: 45
      emulator_count:
        type: number
        default: 2
      sequential_boot:
        type: boolean
        default: true
  push:
    branches:
      - 'feature/*'

jobs:
  set_commit_sha:
    name: Set short git commit SHA
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      short_sha: ${{ steps.get_sha.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Calculate short commit SHA
        id: get_sha
        run: |
         echo "short_sha=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
         echo "Short commit SHA: ${{ steps.get_sha.outputs.short_sha }}"
         if [ -z "${{ steps.get_sha.outputs.short_sha }}" ]; then
           echo "Error: Short commit SHA is empty."
           exit 1
         fi

  android_tests:
    name: Android Tests
    needs: set_commit_sha
    uses: ./.github/workflows/android-multi-version-test.yml
    with:
      android_version: ${{ inputs.android_version }}
      api_level: ${{ inputs.api_level }}
      pixel: ${{ inputs.pixel }}
      runner_type: ${{ inputs.runner_type }}
      architecture: ${{ inputs.architecture }}
      system_image: "system-images;android-${{ inputs.api_level }};google_apis_playstore;${{ inputs.architecture }}"
      java_version: ${{ inputs.java_version }}
      gradle_version: ${{ inputs.gradle_version }}
      timezone: ${{ inputs.timezone }}
      language: ${{ inputs.language }}
      locale: ${{ inputs.locale }}
      max_parallel: ${{ inputs.max_parallel }}
      timeout-minutes: ${{ inputs.timeout_minutes }}
      emulator_count: ${{ inputs.emulator_count }}
      sequential_boot: ${{ inputs.sequential_boot }}
      commit_hash_short: ${{ needs.set_commit_sha.outputs.short_sha }}