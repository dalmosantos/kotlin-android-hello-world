name: CI - Feature Branches

on:
  push:
    branches:
      - 'feature/*'

jobs:
  android_tests:
    uses: ./.github/workflows/android-multi-version-test.yml
    with:
      android_version: 13
      api_level: 33
      pixel: 6a
      system_image: "system-images;android-33;google_apis;x86_64"
      runner_type: macos-13
      architecture: x86_64
      java_version: 17
      gradle_version: 8.12.1
      timezone: America/Sao_Paulo
      language: en_US.UTF-8
      locale: en_US.UTF-8
      max_parallel: 1
      timeout-minutes: 25
      commit_hash: ${{ github.sha }}
      emulator_count: 2
      sequential_boot: true