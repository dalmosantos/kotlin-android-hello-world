name: CI - Android Branches

on:
  push:
    branches:
      - 'feature/*'
      - develop

jobs:
  android_tests_multi_version:
    if: startsWith(github.ref_name, 'feature/') || github.ref_name == 'develop'
    name: Android Tests (9 & 15) - ${{ github.ref_name }}
    uses: ./.github/workflows/android-multi-version-test.yml
    with:
      # Rodar ambos emuladores no mesmo runner, usando Pixel 3a (compatível API 28-35)
      android_version: "9,15"
      api_level: [28,35]
      pixel: "3a"
      # system_image aceita múltiplos separados por vírgula
      system_image: "system-images;android-28;google_apis;x86_64,system-images;android-35;google_apis_playstore;x86_64"
      runner_type: macos-13
      architecture: x86_64
      java_version: 17
      gradle_version: "8.12.1"
      timezone: "America/Sao_Paulo"
      language: "en_US.UTF-8"
      locale: "en_US.UTF-8"
      max_parallel: 1
      timeout-minutes: ${{ github.ref_name == 'develop' && 30 || 20 }}
      commit_hash: ${{ github.sha }}
      emulator_count: 2
      sequential_boot: true